if(b=g("[data-all]")){const ids=lists[b.dataset.all];if(!ids||!ids.length)return;S.shuf=!!b.dataset.sh;saveMeta();return play(ids,S.shuf?ids[Math.random()*ids.length|0]:ids[0])}
if(b=g("[data-view]")){S.view={t:b.dataset.view,k:b.dataset.k};return render()}
if(g("[data-back]")){S.view=null;return render()}
if(g("[data-newpl]"))return newPl();
if(b=g("[data-delpl]")){S.lists=S.lists.filter(l=>l.id!=b.dataset.delpl);del("lists",b.dataset.delpl);S.view=null;return render()}
if(g("[data-wipe]"))return sheet('<h3>¿Borrar toda la biblioteca?</h3><p class="mut">Se eliminan canciones, playlists e historial de este dispositivo.</p><button class="it" data-a="y">Sí, borrar todo</button><button class="it" data-a="n">Cancelar</button>',async a=>{if(a!="y")return;A.pause();S.tracks.forEach(t=>del("tracks",t.id));S.lists.forEach(l=>del("lists",l.id));S.tracks=[];S.lists=[];S.order=[];S.base=[];S.i=-1;upd();render()});
if(b=g("[data-menu]"))return menu(b.dataset.menu)};
function newPl(cb){sheet('<h3>Nueva playlist</h3><input id="pn" class="sr" placeholder="Nombre" aria-label="Nombre de la playlist" style="margin-bottom:12px"><button class="it" data-a="ok">Crear</button>',()=>{const n=$("#pn").value.trim();if(!n)return;const l={id:"p"+Date.now(),name:n,ids:[]};S.lists.push(l);put("lists",l);cb?cb(l):render()});setTimeout(()=>$("#pn")&&$("#pn").focus(),50)}
function addTo(id){sheet('<h3>Añadir a playlist</h3>'+S.lists.map(l=>`<button class="it" data-a="${l.id}">${esc(l.name)}</button>`).join("")+'<button class="it" data-a="new">Nueva playlist</button>',a=>{const add=l=>{if(!l.ids.includes(id))l.ids.push(id);put("lists",l);toast("Añadida a "+l.name)};if(a=="new")setTimeout(()=>newPl(add),0);else add(S.lists.find(l=>l.id==a))})}
function menu(id){const t=$id(id);sheet(`<h3>${esc(t.title)}</h3><button class="it" data-a="next">Reproducir a continuación</button><button class="it" data-a="queue">Añadir al final de la cola</button><button class="it" data-a="fav">${t.fav?"Quitar de favoritas":"Marcar como favorita"}</button><button class="it" data-a="pl">Añadir a playlist</button><button class="it" data-a="mood">Asignar mood</button>${S.view&&S.view.t=="list"?'<button class="it" data-a="rm">Quitar de esta playlist</button>':""}<button class="it" data-a="del">Eliminar de la biblioteca</button>`,a=>{
if(a=="next"||a=="queue"){if(S.i<0){play([id],id)}else S.order.splice(a=="next"?S.i+1:S.order.length,0,id);toast("Añadida a la cola")}
else if(a=="fav"){t.fav=!t.fav;put("tracks",t);upd();render()}
else if(a=="pl")addTo(id);else if(a=="mood")moodPick(id);
else if(a=="rm"){const l=S.lists.find(x=>x.id==S.view.k);l.ids=l.ids.filter(x=>x!=id);put("lists",l);render()}
else if(a=="del"){S.tracks=S.tracks.filter(x=>x.id!=id);del("tracks",id);S.lists.forEach(l=>{l.ids=l.ids.filter(x=>x!=id);put("lists",l)});render()}})}
/* ---------- Controles ---------- */
["file","folder"].forEach(i=>$("#"+i).onchange=e=>{imp([...e.target.files]);e.target.value=""});
$("#up").onclick=()=>sheet('<h3>Subir música</h3><button class="it" data-a="f">Elegir archivos</button><button class="it" data-a="d">Elegir una carpeta entera</button><p class="mut">Usa tus propios archivos de audio.</p>',a=>$(a=="f"?"#file":"#folder").click());
document.addEventListener("dragover",e=>e.preventDefault());document.addEventListener("drop",e=>{e.preventDefault();imp([...e.dataTransfer.files])});
["play","mplay"].forEach(i=>$("#"+i).onclick=toggle);["prev","mprev"].forEach(i=>$("#"+i).onclick=prev);["next","mnext"].forEach(i=>$("#"+i).onclick=()=>next());
$("#mopen").onclick=()=>$("#full").classList.add("open");$("#fclose").onclick=()=>$("#full").classList.remove("open");
$("#seek").oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
$("#shuf").onclick=()=>{S.shuf=!S.shuf;const c=S.order[S.i];if(S.shuf)S.order=[c,...shuffle(S.order.filter(x=>x!==c))],S.i=0;else{S.order=S.base.includes(c)?S.base.slice():S.order;S.i=S.order.indexOf(c)}saveMeta();upd()};
$("#rep").onclick=()=>{S.rep=(S.rep+1)%3;saveMeta();upd()};
$("#fav").onclick=()=>{const t=$id(S.order[S.i]);if(t){t.fav=!t.fav;put("tracks",t);upd();render()}};
$("#addpl").onclick=()=>S.order[S.i]&&addTo(S.order[S.i]);
[["qbtn","q"],["eqbtn","e"],["tmr","t"]].forEach(([b,p])=>$("#"+b).onclick=()=>{panel=panel==p?"":p;drawPanel()});
document.addEventListener("keydown",e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.code=="Space"){e.preventDefault();toggle()}if(e.code=="ArrowRight")A.currentTime+=10;if(e.code=="ArrowLeft")A.currentTime-=10});
function applyTheme(){S.theme?document.documentElement.setAttribute("data-theme",S.theme):document.documentElement.removeAttribute("data-theme")}
/* ---------- Botón atrás del móvil ---------- */
function goBack(){const sh=$("#sheet");if(sh.classList.contains("open")){sh.classList.remove("open");return true}if($("#full").classList.contains("open")){$("#full").classList.remove("open");return true}if(S.q){S.q="";$("#q").value="";render();return true}if(S.view){S.view=null;render();return true}if(S.tab=="set"&&S.sub){S.sub="";render();return true}if(FL.includes(S.tab)&&S.tab!="flow"){S.tab="flow";render();return true}if(S.tab!="home"){S.tab="home";render();return true}return false}
const guard=()=>{try{history.pushState({d:1},"")}catch(e){}};
try{history.replaceState({d:0},"");guard()}catch(e){}
window.addEventListener("popstate",()=>{if(goBack()){guard();return}toast("Pulsa atrás otra vez para salir");setTimeout(()=>{if(history.state&&history.state.d===0)guard()},2300)});
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
(async()=>{await open();const m=await getMeta();if(m)Object.assign(S,m);S.set=Object.assign({},DEF,S.set||{});applyTheme();applySet();setIcons();S.tracks=await all("tracks");S.lists=await all("lists");render();if(!S.tracks.length&&!m)demo();else{fixCovers();restore()}})();
</script></body></html>
